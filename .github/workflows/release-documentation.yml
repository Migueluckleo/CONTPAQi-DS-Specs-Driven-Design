name: Release documentation
on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  release-documentation:
    name: release-documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Architecture integrity
        run: python3 -B -m blueheart check
      - name: Infrastructure tests
        run: python3 -B -m unittest discover -s tests -q
      - name: Verify every introduced commit and component version
        run: python3 -B -m blueheart.release_docs ci --receipt "$RUNNER_TEMP/release-receipt.json"
      - name: Preserve verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-receipt.json
          if-no-files-found: error
